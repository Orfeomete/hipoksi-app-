<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hipoksi Tespit Uygulaması</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const icons = window.lucide || {};

    const Heart = (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size||24} height={props.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>;
    const Activity = (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size||24} height={props.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
    const Wind = (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size||24} height={props.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className}><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path></svg>;
    const TrendingUp = (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size||24} height={props.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
    const Brain = (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size||24} height={props.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.88A2.5 2.5 0 0 1 9.5 2Z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.88A2.5 2.5 0 0 0 14.5 2Z"></path></svg>;
    const AlertTriangle = (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size||24} height={props.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
    const Settings = (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size||24} height={props.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={props.className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;

    const SmartWatchHypoxia = () => {
      const [currentScreen, setCurrentScreen] = useState('main');
      const [spo2, setSpo2] = useState(98);
      const [heartRate, setHeartRate] = useState(75);
      const [respirationRate, setRespirationRate] = useState(16);
      const [riskLevel, setRiskLevel] = useState(12);
      const [time, setTime] = useState(new Date());

      useEffect(() => {
        const interval = setInterval(() => {
          setTime(new Date());
          setSpo2(prev => Math.max(90, Math.min(100, prev + (Math.random() - 0.5) * 2)));
          setHeartRate(prev => Math.max(50, Math.min(180, prev + (Math.random() - 0.5) * 10)));
          setRespirationRate(prev => Math.max(8, Math.min(30, prev + (Math.random() - 0.5) * 2)));
          const newRisk = Math.max(5, Math.min(25, (100 - spo2) * 2 + Math.abs(heartRate - 70) * 0.1));
          setRiskLevel(Math.round(newRisk));
        }, 3000);
        return () => clearInterval(interval);
      }, [spo2, heartRate]);

      const getRiskColor = () => riskLevel < 10 ? 'text-emerald-600' : riskLevel < 15 ? 'text-amber-600' : 'text-rose-600';
      const getRiskStroke = () => riskLevel < 10 ? 'stroke-emerald-500' : riskLevel < 15 ? 'stroke-amber-500' : 'stroke-rose-500';
      const getRiskBg = () => riskLevel < 10 ? 'bg-emerald-500' : riskLevel < 15 ? 'bg-amber-500' : 'bg-rose-500';

      const CircularProgress = ({ value, maxValue, color, size = 120, strokeWidth = 8 }) => {
        const radius = (size - strokeWidth) / 2;
        const circumference = radius * 2 * Math.PI;
        const offset = circumference - (value / maxValue) * circumference;
        return (
          <svg width={size} height={size} className="transform -rotate-90">
            <circle cx={size/2} cy={size/2} r={radius} stroke="currentColor" strokeWidth={strokeWidth} fill="none" className="text-gray-200" />
            <circle cx={size/2} cy={size/2} r={radius} stroke="currentColor" strokeWidth={strokeWidth} fill="none" strokeDasharray={circumference} strokeDashoffset={offset} className={color} strokeLinecap="round" />
          </svg>
        );
      };

      const MainScreen = () => (
        <div className="relative w-full h-full">
          <div className="absolute top-8 left-1/2 transform -translate-x-1/2 text-gray-700 text-base font-semibold">
            {time.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}
          </div>
          <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <div className="relative">
              <CircularProgress value={riskLevel} maxValue={30} color={getRiskStroke()} size={150} strokeWidth={12} />
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <div className={`text-4xl font-bold ${getRiskColor()}`}>{riskLevel}%</div>
                <div className="text-gray-500 text-sm mt-1 font-medium">RİSK</div>
              </div>
            </div>
          </div>
          <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <div className="absolute" style={{left:'50%',top:'50%',transform:'translate(53px, -53px) translate(-50%, -50%)'}}>
              <div className="flex flex-col items-center justify-center bg-white shadow-lg rounded-full p-2 border border-gray-200 w-14 h-14">
                <Heart className="text-rose-500" size={12} />
                <div className="text-gray-800 font-bold text-xs mt-0.5">{Math.round(heartRate)}</div>
              </div>
            </div>
            <div className="absolute" style={{left:'50%',top:'50%',transform:'translate(53px, 53px) translate(-50%, -50%)'}}>
              <div className="flex flex-col items-center justify-center bg-white shadow-lg rounded-full p-2 border border-gray-200 w-14 h-14">
                <Activity className="text-blue-500" size={12} />
                <div className="text-gray-800 font-bold text-xs mt-0.5">{Math.round(spo2)}%</div>
              </div>
            </div>
            <div className="absolute" style={{left:'50%',top:'50%',transform:'translate(-53px, 53px) translate(-50%, -50%)'}}>
              <div className="flex flex-col items-center justify-center bg-white shadow-lg rounded-full p-2 border border-gray-200 w-14 h-14">
                <Wind className="text-cyan-500" size={12} />
                <div className="text-gray-800 font-bold text-xs mt-0.5">{Math.round(respirationRate)}</div>
              </div>
            </div>
            <div className="absolute" style={{left:'50%',top:'50%',transform:'translate(-53px, -53px) translate(-50%, -50%)'}}>
              <div className="flex flex-col items-center justify-center bg-white shadow-lg rounded-full p-2 border border-gray-200 w-14 h-14">
                <TrendingUp className="text-purple-500" size={12} />
                <div className="text-gray-800 font-bold text-xs mt-0.5">8K</div>
              </div>
            </div>
          </div>
          <div className="absolute bottom-16 left-1/2 transform -translate-x-1/2 text-center">
            <div className="text-gray-500 text-xs mb-2 font-medium">TAHMİN</div>
            <div className={`px-4 py-2 rounded-full text-sm font-bold text-white ${getRiskBg()}`}>
              {riskLevel < 10 ? 'NORMAL' : riskLevel < 15 ? '5dk SONRA' : '10dk SONRA'}
            </div>
          </div>
          <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex gap-1.5">
            {['main','vitals','trends','settings'].map((s) => (
              <button key={s} onClick={() => setCurrentScreen(s)} className={`h-2 rounded-full transition-all ${currentScreen === s ? 'bg-blue-500 w-6' : 'bg-gray-300 w-2'}`} />
            ))}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center p-4">
          <div className="relative">
            <div className="w-80 h-80 rounded-full bg-gradient-to-br from-gray-300 via-gray-200 to-gray-300 p-4 shadow-2xl">
              <div className="w-full h-full rounded-full bg-gradient-to-br from-white to-gray-50 overflow-hidden relative border-4 border-gray-100">
                <div className="w-full h-full relative"><MainScreen /></div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SmartWatchHypoxia />);
  </script>
</body>
</html>
