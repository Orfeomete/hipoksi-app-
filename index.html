<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PilotO2 Watch Application</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const T = {
      tr: {
        risk: 'RİSK',
        normal: 'NORMAL', in5: '5dk SONRA', in10: '10dk SONRA',
        vitalsTitle: 'Vital Göstergeler',
        heart: 'Kalp', respiration: 'Solunum', altitude: 'İrtifa',
        aiTitle: 'AI Model', lstmAcc: 'LSTM Doğruluk',
        confidence: 'Güven', latency: 'Süre', success: 'Başarı',
        riskTimeline: 'Risk Tahmini',
        now: 'Şimdi', min5: '5dk', min10: '10dk',
        settingsTitle: 'Ayarlar',
        model: 'Model', test: 'Test', analysis: 'Analiz', emergency: 'Acil',
        swipe: 'Kaydır →',
        locale: 'tr-TR',
      },
      en: {
        risk: 'RISK',
        normal: 'NORMAL', in5: 'IN 5min', in10: 'IN 10min',
        vitalsTitle: 'Vital Signs',
        heart: 'Heart', respiration: 'Respir.', altitude: 'Altitude',
        aiTitle: 'AI Model', lstmAcc: 'LSTM Accuracy',
        confidence: 'Confidence', latency: 'Latency', success: 'Success',
        riskTimeline: 'Risk Forecast',
        now: 'Now', min5: '5min', min10: '10min',
        settingsTitle: 'Settings',
        model: 'Model', test: 'Test', analysis: 'Analysis', emergency: 'Emergency',
        swipe: 'Swipe →',
        locale: 'en-GB',
      }
    };

    // Icons
    const HeartIcon  = ({size=14,cls=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={cls}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
    const ActivityIcon=({size=14,cls=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={cls}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
    const WindIcon   = ({size=14,cls=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={cls}><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>;
    const TrendIcon  = ({size=14,cls=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={cls}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    const BrainIcon  = ({size=28,cls=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={cls}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.14"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.14"/></svg>;
    const AlertIcon  = ({size=14,cls=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={cls}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    const GearIcon   = ({size=22,cls=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={cls}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;

    const Ring = ({ value, max, color, size=110, sw=9, children }) => {
      const r = (size - sw) / 2;
      const circ = r * 2 * Math.PI;
      const offset = circ - (value / max) * circ;
      return (
        <div style={{position:'relative', width:size, height:size, display:'inline-flex', alignItems:'center', justifyContent:'center'}}>
          <svg width={size} height={size} style={{transform:'rotate(-90deg)', position:'absolute'}}>
            <circle cx={size/2} cy={size/2} r={r} stroke="#e5e7eb" strokeWidth={sw} fill="none"/>
            <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={sw} fill="none"
              strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
              style={{transition:'stroke-dashoffset 0.6s ease'}}/>
          </svg>
          <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}>
            {children}
          </div>
        </div>
      );
    };

    const PilotO2 = () => {
      const [screen, setScreen] = useState('main');
      const [spo2, setSpo2]     = useState(98);
      const [hr, setHr]         = useState(75);
      const [rr, setRr]         = useState(16);
      const [risk, setRisk]     = useState(12);
      const [time, setTime]     = useState(new Date());
      const [lang, setLang]     = useState('tr');
      const t = T[lang];

      useEffect(() => {
        const iv = setInterval(() => {
          setTime(new Date());
          setSpo2(p => Math.max(90, Math.min(100, p + (Math.random()-0.5)*2)));
          setHr(p   => Math.max(50, Math.min(180, p + (Math.random()-0.5)*10)));
          setRr(p   => Math.max(8,  Math.min(30,  p + (Math.random()-0.5)*2)));
          setRisk(p  => Math.max(5,  Math.min(25,  Math.round(p + (Math.random()-0.5)*3))));
        }, 3000);
        return () => clearInterval(iv);
      }, []);

      const screens = ['main','vitals','trends','settings'];
      const next = () => setScreen(s => screens[(screens.indexOf(s)+1) % screens.length]);
      const prev = (e) => { e.preventDefault(); setScreen(s => screens[(screens.indexOf(s)-1+screens.length) % screens.length]); };

      const riskColor  = risk < 10 ? '#10b981' : risk < 18 ? '#f59e0b' : '#ef4444';
      const riskLabel  = risk < 10 ? t.normal : risk < 18 ? t.in5 : t.in10;

      /* ── SCREENS ── */

      const MainScreen = () => (
        <div style={{width:'100%', height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between', padding:'18px 12px 14px'}}>
          {/* Time */}
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:22, fontWeight:700, color:'#1f2937', fontFamily:'monospace', letterSpacing:2}}>
              {time.toLocaleTimeString(t.locale,{hour:'2-digit',minute:'2-digit'})}
            </div>
            <div style={{fontSize:11, color:'#9ca3af', marginTop:1}}>
              {time.toLocaleDateString(t.locale,{day:'2-digit',month:'short'})}
            </div>
          </div>

          {/* Main ring + satellites */}
          <div style={{position:'relative', width:170, height:170, display:'flex', alignItems:'center', justifyContent:'center'}}>
            {/* Center ring */}
            <Ring value={risk} max={30} color={riskColor} size={120} sw={10}>
              <div style={{fontSize:26, fontWeight:800, color:riskColor}}>{risk}%</div>
              <div style={{fontSize:10, color:'#9ca3af', fontWeight:600}}>{t.risk}</div>
            </Ring>

            {/* Satellites — positioned around the ring */}
            {[
              { icon:<HeartIcon cls="text-rose-500"/>,   val:`${Math.round(hr)}`,   top:-8,  left:'50%', ml:-28, bg:'#fff1f2', border:'#fecdd3' },
              { icon:<ActivityIcon cls="text-blue-500"/>, val:`${Math.round(spo2)}%`, top:'50%', mt:-28, right:-8, bg:'#eff6ff', border:'#bfdbfe' },
              { icon:<WindIcon cls="text-cyan-500"/>,    val:`${Math.round(rr)}`,   bottom:-8,left:'50%', ml:-28, bg:'#ecfeff', border:'#a5f3fc' },
              { icon:<TrendIcon cls="text-purple-500"/>, val:'8K',                  top:'50%', mt:-28, left:-8, bg:'#faf5ff', border:'#e9d5ff' },
            ].map((s,i) => {
              const style = {
                position:'absolute', display:'flex', flexDirection:'column',
                alignItems:'center', justifyContent:'center',
                width:40, height:40, borderRadius:'50%',
                background: s.bg, border:`1px solid ${s.border}`,
                boxShadow:'0 1px 4px rgba(0,0,0,0.08)'
              };
              if (s.top !== undefined && s.top !== '50%') style.top = s.top;
              if (s.top === '50%') { style.top = '50%'; style.marginTop = s.mt; }
              if (s.bottom !== undefined) style.bottom = s.bottom;
              if (s.left !== undefined && s.left !== '50%') style.left = s.left;
              if (s.left === '50%') { style.left = '50%'; style.marginLeft = s.ml; }
              if (s.right !== undefined) style.right = s.right;
              return (
                <div key={i} style={style}>
                  {s.icon}
                  <div style={{fontSize:9, fontWeight:700, color:'#374151', marginTop:1}}>{s.val}</div>
                </div>
              );
            })}
          </div>

          {/* Forecast pill */}
          <div style={{
            padding:'6px 18px', borderRadius:999, fontSize:12, fontWeight:700,
            color:'#fff', background: riskColor
          }}>{riskLabel}</div>
        </div>
      );

      const VitalsScreen = () => (
        <div style={{width:'100%', height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between', padding:'14px 8px 14px'}}>
          <div style={{fontSize:13, fontWeight:700, color:'#374151'}}>{t.vitalsTitle}</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginTop:4}}>
            {[
              { label:'SpO2', val:`${Math.round(spo2)}`, unit:'%',   color:'#3b82f6', max:100, v:spo2 },
              { label:t.heart,val:`${Math.round(hr)}`,   unit:'BPM', color:'#ef4444', max:180, v:hr },
              { label:t.respiration, val:`${Math.round(rr)}`, unit:'/dk', color:'#06b6d4', max:30, v:rr },
              { label:t.altitude,    val:'8K',            unit:'ft',  color:'#8b5cf6', max:20000, v:8000 },
            ].map((item,i) => (
              <div key={i} style={{display:'flex', flexDirection:'column', alignItems:'center'}}>
                <Ring value={item.v} max={item.max} color={item.color} size={82} sw={6}>
                  <div style={{fontSize:15, fontWeight:700, color:item.color}}>{item.val}</div>
                  <div style={{fontSize:8, color:'#9ca3af'}}>{item.unit}</div>
                </Ring>
                <div style={{fontSize:10, color:'#6b7280', fontWeight:600, marginTop:3}}>{item.label}</div>
              </div>
            ))}
          </div>
        </div>
      );

      const TrendsScreen = () => (
        <div style={{width:'100%', height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between', padding:'14px 10px 14px'}}>
          <div style={{fontSize:13, fontWeight:700, color:'#374151'}}>{t.aiTitle}</div>
          <div style={{textAlign:'center'}}>
            <BrainIcon cls="text-purple-500" size={28}/>
            <div style={{fontSize:24, fontWeight:800, color:'#1f2937', marginTop:4}}>94.2%</div>
            <div style={{fontSize:10, color:'#9ca3af', fontWeight:600}}>{t.lstmAcc}</div>
          </div>
          <div style={{width:'100%', background:'#f9fafb', borderRadius:12, padding:'10px 12px', border:'1px solid #e5e7eb'}}>
            <div style={{fontSize:10, fontWeight:700, color:'#374151', marginBottom:8, textAlign:'center'}}>{t.riskTimeline}</div>
            {[
              { label:t.now,  pct:'5%',  color:'#10b981', w:'40%' },
              { label:t.min5, pct:'8%',  color:'#f59e0b', w:'55%' },
              { label:t.min10,pct:'15%', color:'#ef4444', w:'80%' },
            ].map((row,i) => (
              <div key={i} style={{display:'flex', alignItems:'center', gap:8, marginBottom: i<2 ? 6:0}}>
                <span style={{fontSize:10, color:'#6b7280', width:28, flexShrink:0}}>{row.label}</span>
                <div style={{flex:1, height:5, background:'#e5e7eb', borderRadius:99, overflow:'hidden'}}>
                  <div style={{width:row.w, height:'100%', background:row.color, borderRadius:99}}/>
                </div>
                <span style={{fontSize:10, fontWeight:700, color:row.color, width:24}}>{row.pct}</span>
              </div>
            ))}
          </div>
        </div>
      );

      const SettingsScreen = () => {
        const items = [
          { icon:<BrainIcon size={16} cls="text-blue-500"/>,   label:t.model,    color:'#3b82f6', border:'#bfdbfe' },
          { icon:<ActivityIcon size={14} cls="text-emerald-500"/>, label:t.test, color:'#10b981', border:'#a7f3d0' },
          { icon:<TrendIcon size={14} cls="text-purple-500"/>,  label:t.analysis, color:'#8b5cf6', border:'#e9d5ff' },
          { icon:<AlertIcon size={14} cls="text-rose-500"/>,    label:t.emergency,color:'#ef4444', border:'#fecdd3' },
        ];
        // circle positions: top, right, bottom, left
        const pos = [
          {top:0,    left:'50%', transform:'translateX(-50%)'},
          {top:'50%',right:0,   transform:'translateY(-50%)'},
          {bottom:0, left:'50%',transform:'translateX(-50%)'},
          {top:'50%',left:0,    transform:'translateY(-50%)'},
        ];
        return (
          <div style={{width:'100%', height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between', padding:'14px 8px 12px'}}>
            <div style={{fontSize:13, fontWeight:700, color:'#374151'}}>{t.settingsTitle}</div>
            <div style={{position:'relative', width:150, height:150}}>
              {/* center gear */}
              <div style={{position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)',
                width:44, height:44, borderRadius:'50%', background:'#f3f4f6',
                display:'flex', alignItems:'center', justifyContent:'center'}}>
                <GearIcon cls="text-gray-400" size={20}/>
              </div>
              {items.map((item,i) => (
                <div key={i} style={{
                  position:'absolute', ...pos[i],
                  width:46, height:46, borderRadius:'50%',
                  background:'#fff', border:`1.5px solid ${item.border}`,
                  boxShadow:'0 1px 6px rgba(0,0,0,0.07)',
                  display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                  gap:2, cursor:'pointer'
                }}>
                  {item.icon}
                  <div style={{fontSize:9, fontWeight:600, color:item.color}}>{item.label}</div>
                </div>
              ))}
            </div>
            <div style={{textAlign:'center', fontSize:9, color:'#9ca3af', lineHeight:1.6}}>
              <div style={{fontWeight:700, color:'#6b7280'}}>Hipoksi AI v2.1</div>
              <div>LSTM Neural Network</div>
              <div>Multi-Sensor Fusion</div>
            </div>
          </div>
        );
      };

      const renderScreen = () => {
        switch(screen) {
          case 'vitals':   return <VitalsScreen />;
          case 'trends':   return <TrendsScreen />;
          case 'settings': return <SettingsScreen />;
          default:         return <MainScreen />;
        }
      };

      return (
        <div style={{minHeight:'100vh', background:'#fff', display:'flex', alignItems:'center', justifyContent:'center', padding:32}}>

          {/* Lang toggle */}
          <button onClick={() => setLang(l => l==='tr'?'en':'tr')} style={{
            position:'fixed', top:16, right:16,
            background:'#1f2937', border:'1px solid #374151',
            color:'#f9fafb', borderRadius:6, padding:'4px 12px',
            fontSize:12, fontFamily:'monospace', letterSpacing:1,
            cursor:'pointer', zIndex:1000
          }}>{lang==='tr'?'EN':'TR'}</button>

          {/* Watch body */}
          <div style={{position:'relative'}}>
            <div style={{
              width:300, height:300, borderRadius:'50%',
              background:'linear-gradient(135deg, #d1d5db, #e5e7eb, #d1d5db)',
              padding:14, boxShadow:'0 20px 60px rgba(0,0,0,0.18)'
            }}>
              <div
                onClick={next}
                onContextMenu={prev}
                style={{
                  width:'100%', height:'100%', borderRadius:'50%',
                  background:'linear-gradient(135deg, #ffffff, #f9fafb)',
                  border:'3px solid #f3f4f6',
                  overflow:'hidden', position:'relative',
                  cursor:'pointer', userSelect:'none'
                }}
              >
                {renderScreen()}
                <div style={{
                  position:'absolute', inset:0, borderRadius:'50%',
                  background:'linear-gradient(135deg, rgba(255,255,255,0.25), transparent)',
                  pointerEvents:'none'
                }}/>
              </div>
            </div>
            {/* Crown button only — no ears */}
            <div style={{
              position:'absolute', right:-2, top:'50%', transform:'translateY(-50%)',
              width:6, height:28, background:'#9ca3af', borderRadius:'0 4px 4px 0',
              boxShadow:'1px 0 3px rgba(0,0,0,0.15)'
            }}/>
          </div>

          {/* Swipe hint */}
          <div style={{
            position:'fixed', bottom:20, left:'50%', transform:'translateX(-50%)',
            fontSize:11, color:'#d1d5db', fontFamily:'monospace'
          }}>{t.swipe}</div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PilotO2 />);
  </script>
</body>
</html>
